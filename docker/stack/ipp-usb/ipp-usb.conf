# Inside the container. The listener is reachable only on the private compose network
# (the port is never published to the host or the LAN: printing must go through the gateway).
[network]
  http-min-port = 60000
  http-max-port = 60099
  dns-sd = disable       # no avahi/dbus in the container; the gateway is what clients talk to
  interface = all        # = the container's own interface on the private network
  ipv6 = disable

[logging]
  device-log    = all
  main-log      = info
  console-log   = info
  console-color = disable
